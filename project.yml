name: DevKit
options:
  bundleIdPrefix: com.yeris
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.yeris.devkitv2
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    INFOPLIST_KEY_LSUIElement: true
    INFOPLIST_KEY_NSAppleEventsUsageDescription: "DevKit needs permission to run privileged commands."
    ENABLE_APP_SANDBOX: false
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual

targets:
  DevKit:
    type: application
    platform: macOS
    sources:
      - path: DevKit
        excludes:
          - "Resources/Assets.xcassets/AppIcon.appiconset/Contents.json"
    resources:
      - path: DevKit/Resources/Assets.xcassets
      - path: icon.icns
    settings:
      base:
        PRODUCT_NAME: DevKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: false
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: DevKit/Resources/Info.plist
    postBuildScripts:
      - script: |
          cp "${SRCROOT}/icon.icns" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/icon.icns"
        name: Copy Icon
    entitlements:
      path: DevKit/Resources/DevKit.entitlements
      properties:
        com.apple.security.automation.apple-events: true
